<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <style>
    .bg { fill: #2c3e50; }
    .title { font-family: Impact, sans-serif; font-size: 20px; fill: #e74c3c; letter-spacing: 1px; }
    .messy-text { font-family: monospace; font-size: 11px; fill: #f1c40f; transform: rotate(-15deg); }
    .warning { font-family: sans-serif; font-size: 12px; fill: #ecf0f1; font-weight: bold; }
  </style>
  
  <rect width="100%" height="100%" class="bg" rx="8" />
  
  <text x="40" y="40" class="title">HAPPINESS CHART 3D EXTREME (BAD VIZ)</text>
  <text x="40" y="65" class="warning">Warning: Overlapping labels, harsh colors, and 3D distortion distort perception.</text>
  
  <!-- Cluttered overlapping pie/bar graphics simulation -->
  <circle cx="350" cy="250" r="130" fill="#9b59b6" stroke="#e74c3c" stroke-width="8" />
  <path d="M 350 250 L 480 200 A 130 130 0 0 1 450 350 Z" fill="#2ecc71" />
  <path d="M 350 250 L 450 350 A 130 130 0 0 1 250 350 Z" fill="#e67e22" />
  <path d="M 350 250 L 250 350 A 130 130 0 0 1 230 200 Z" fill="#3498db" />
  
  <!-- Overlapping unreadable text elements -->
  <text x="310" y="180" class="messy-text">Finland: 7.749912</text>
  <text x="380" y="260" class="messy-text">Denmark: 7.5211</text>
  <text x="260" y="300" class="messy-text">Iceland: 7.5205</text>
  <text x="320" y="340" class="messy-text">Sweden: 7.3502</text>
  <text x="210" y="240" class="messy-text">Netherlands: 7.311</text>
  <text x="400" y="190" class="messy-text">Costa Rica: 7.27</text>
</svg>