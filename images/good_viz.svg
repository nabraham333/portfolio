<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <style>
    .bg { fill: #f9fbfd; }
    .title { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
    .subtitle { font-family: sans-serif; font-size: 12px; fill: #7f8c8d; }
    .label { font-family: sans-serif; font-size: 13px; fill: #34495e; font-weight: 500; }
    .value { font-family: sans-serif; font-size: 12px; fill: #ffffff; font-weight: bold; }
    .bar { fill: #3498db; rx: 4; }
    .axis { stroke: #bdc3c7; stroke-width: 1; }
  </style>
  
  <!-- Background -->
  <rect width="100%" height="100%" class="bg" rx="8" />
  
  <!-- Title -->
  <text x="40" y="40" class="title">Top 5 Happiest Countries (Good Visualization)</text>
  <text x="40" y="60" class="subtitle">Clean horizontal bars sorted descending with clear value labels</text>
  
  <!-- Axis Line -->
  <line x1="140" y1="90" x2="140" y2="400" class="axis" />
  
  <!-- Bar 1: Finland -->
  <text x="130" y="118" text-anchor="end" class="label">Finland</text>
  <rect x="140" y="98" width="387" height="28" class="bar" />
  <text x="515" y="117" class="value">7.74</text>
  
  <!-- Bar 2: Denmark -->
  <text x="130" y="174" text-anchor="end" class="label">Denmark</text>
  <rect x="140" y="154" width="376" height="28" class="bar" />
  <text x="504" y="173" class="value">7.52</text>
  
  <!-- Bar 3: Iceland -->
  <text x="130" y="230" text-anchor="end" class="label">Iceland</text>
  <rect x="140" y="210" width="376" height="28" class="bar" />
  <text x="504" y="229" class="value">7.52</text>
  
  <!-- Bar 4: Sweden -->
  <text x="130" y="286" text-anchor="end" class="label">Sweden</text>
  <rect x="140" y="266" width="367" height="28" class="bar" />
  <text x="495" y="285" class="value">7.35</text>
  
  <!-- Bar 5: Netherlands -->
  <text x="130" y="342" text-anchor="end" class="label">Netherlands</text>
  <rect x="140" y="322" width="365" height="28" class="bar" />
  <text x="493" y="341" class="value">7.31</text>
</svg>